name: SELA
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  pinput: ^3.0.1
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  flutter_launcher_icons: ^0.14.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/App_Logo.png
    - assets/images/logo.png
    - assets/images/forgot_pass.png
    - assets/images/otp.png
    - assets/images/new_pass.png
    - assets/images/success.png
    - assets/images/default_profile.png
    - assets/images/group_task.png
    - assets/images/independent_task.png
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: 'assets/images/App_Logo.png'
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
